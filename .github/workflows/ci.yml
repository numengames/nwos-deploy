#
# This workflow is the repository's feedback loop: it is where a rule stops
# being prose and starts refusing merges. Each step below says what it
# checks and how to fix it when it turns red.
#
# Two kinds of job, told apart by the archive's ENG-067 (STD-005):
#
#   · ARTEFACT jobs verify the thing under review — it compiles, the tests
#     pass, the favicon and share card exist. They fail the build whatever
#     any standard says, because a page that does not build is broken.
#   · RULE jobs verify a practice from STD-015 (files that must exist, a
#     phrase CLAUDE.md must carry). While that register is `draft` they
#     LOOK BUT DO NOT BITE: they print every finding, in the log and in the
#     job summary, and exit 0. Promoting STD-015 to `active` is what turns
#     them into failures — not an edit here.
#
# One required check, literally named `build` (STD-015 § The family
# pipeline): the branch ruleset can only require a check by NAME, so the
# name means the same in every Numen repository. Here the work is split
# across jobs, so `build` is the conjunction of the artefact jobs and
# depends on nothing that only reports.
#
# Security (STD-015): third-party actions pinned by commit SHA, never by a
# movable tag (SEC-007); the workflow token is read-only and no job asks for
# more (SEC-008); no secret is read by the build — publication is
# Cloudflare's, connected in its panel (SEC-004).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── ARTEFACT ────────────────────────────────────────────────────────────
  # ARC-001 (STD-015): the same pipeline in every repository —
  # type-check → lint → test → build. Red here means the site is broken;
  # the failing step names the file.
  pipeline:
    name: type-check → lint → test → build
    runs-on: ubuntu-latest
    steps:
      # Checkout of the PR head, pinned by SHA.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Node 22 with the npm cache keyed on package-lock.json. The same
      # major the Worker runs; a green build on another version proves
      # nothing about production.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # Dependencies from the lockfile, exactly. Not a check.
      - run: npm ci

      # `astro check`: a reference to a content key, a prop or a type that
      # does not exist fails here, not in the visitor's browser. Astro
      # does not validate types when it builds, so if this step is not
      # here, nobody runs it.
      - name: Type-check
        run: npm run type-check

      # `prettier --check .` then `eslint .` over the whole tree. A new
      # file that was not formatted fails this step: run
      # `npx prettier --write <file>` and push.
      - name: Lint
        run: npm run lint

      # vitest. Red means a behaviour changed and its test says so.
      #
      # Coverage of the logic (src/lib, src/data, src/pages/api, scripts) is
      # measured on every run and its summary goes to the job summary. It
      # has no threshold: while STD-015 is draft the figure is seen, not
      # enforced (ENG-067). The threshold arrives when the register goes
      # active, pinned to the value measured then. A failing test still
      # fails this step.
      - name: Test
        run: |
          set +e
          out="$(npm test 2>&1)"; status=$?
          set -e
          echo "$out"
          {
            echo "### Coverage of the logic — seen, not enforced (STD-015 draft, ENG-067)"
            echo
            echo '```'
            echo "$out" | grep -E '^(Statements|Branches|Functions|Lines) ' || echo "(no coverage summary in the output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # A change to the site must say what it changed: any diff under src/
      # needs a new entry (and version) in src/data/updates.ts. The footer
      # prints that version and links to /updates. Same script in every
      # Numen repository; only the path constants differ.
      - name: Version bump
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.base_ref || 'main' }}"
          node scripts/check-version-bump.mjs --base "origin/${{ github.base_ref || 'main' }}"

      # `astro build` into dist/. prebuild generates src/styles/tokens.css
      # from the installed design kit and draws the favicon set and the
      # share card; postbuild runs scripts/license-check.mjs (Canon C-005
      # §5) over the bundled modules against LEGAL_DEBT.md. A page that
      # fails to render, or a dependency with a licence the allowlist
      # refuses, fails here.
      - name: Build
        run: npm run build

      # DSN-014 (STD-008): a link presents itself. The build above drew the
      # favicon set and the 1200×630 share card into public/; this proves
      # the four files exist and the card has the size link previews need.
      - name: Share card
        run: node scripts/share-card.mjs --check

  # ── RULE (looks, does not bite) ────────────────────────────────────────
  # STD-015's repository checklist: the files every Numen repository
  # carries, and the two phrases CLAUDE.md must hold (AGT-001: the first
  # instruction is to audit the branch; the pointer at the design kit).
  # Every finding is printed here and in the job summary; the job exits 0
  # while STD-015 is `draft` (ENG-067). Fix a finding by adding the file or
  # the phrase — never by editing the list to match the tree.
  presence:
    name: Repository checklist (reports, does not block)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Files the standards require, and the CLAUDE.md contract
        run: |
          findings=()
          for f in CLAUDE.md SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md \
                   .editorconfig .env.example REUSE.toml LICENSE \
                   TRADEMARKS.md CLA.md CLA-SIGNATORIES.md \
                   .github/CODEOWNERS .github/PULL_REQUEST_TEMPLATE.md \
                   .github/dependabot.yml .github/ISSUE_TEMPLATE/bug_report.yml; do
            [ -f "$f" ] || findings+=("missing file: $f — required by the repository checklist (STD-015)")
          done
          grep -q "audit the current branch state" CLAUDE.md \
            || findings+=("CLAUDE.md does not open with the audit instruction (AGT-001)")
          grep -q "design-kit" CLAUDE.md \
            || findings+=("CLAUDE.md does not point at the design kit")

          if [ "${#findings[@]}" -eq 0 ]; then
            echo "Repository checklist: every required file is present; CLAUDE.md carries the contract."
            echo "Repository checklist: clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Findings are reported as warnings, not errors: STD-015 is
          # draft, so this guard looks but does not bite (ENG-067).
          {
            echo "### Repository checklist — ${#findings[@]} finding(s), not blocking while STD-015 is draft"
            echo
            for x in "${findings[@]}"; do echo "- $x"; done
          } >> "$GITHUB_STEP_SUMMARY"
          for x in "${findings[@]}"; do echo "::warning::$x"; done
          exit 0

      # TRC-007 (STD-015): every guard declares what it does NOT look at,
      # on success as on failure. A green here proves the files exist and
      # two phrases are present — nothing about their contents being true.
      - name: What this guard does not see
        if: always()
        run: |
          echo "This guard does NOT check:"
          echo "  - whether the files say anything true (only that they exist)"
          echo "  - whether CLAUDE.md's instructions are followed (only that two phrases are there)"
          echo "  - the CLA signature of the PR author (license-check.yml, job cla)"
          echo "  - whether the site is published (Workers Builds, outside this repo; nwos.numen.games/version.json tells)"

  # ── THE REQUIRED CHECK ─────────────────────────────────────────────────
  # The single check the ruleset requires, named `build` in every Numen
  # repository (STD-015 § The family pipeline). It is not a fourth piece of
  # work: it is the conjunction of the artefact jobs, and it cannot pass
  # unless all of them did. `presence` is deliberately absent — it reports.
  #
  # Adding an artefact job means adding it to `needs` AND to the loop below,
  # or the ruleset keeps protecting yesterday's list. Renaming this job
  # leaves the required check pending forever and blocks every merge.
  #
  # Measured 2026-09-18 before this job existed: the ruleset required no
  # check at all, so a red pipeline did not stop a merge here, while the
  # other Numen repositories already required `build`.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [pipeline]
    if: always()
    steps:
      - name: Every artefact job passed
        run: |
          set -euo pipefail
          failed=0
          for gate in "pipeline:${{ needs.pipeline.result }}"; do
            name="${gate%%:*}"; result="${gate#*:}"
            printf '%-10s %s\n' "$name" "$result"
            [ "$result" = "success" ] || failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::an artefact job did not pass — read its log, the failing step names the file"
            exit 1
          fi
          echo "All artefact jobs passed."
