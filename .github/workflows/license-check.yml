# Canon C-005 §5 (DEBE): license-check en cada build, inspeccionando el
# contenido del artefacto (npm run build ejecuta postbuild →
# scripts/license-check.mjs). Severidad error: este repo despliega a
# producción. §6: gate de CLA en cada pull request (repo con código AGPL).
name: license-check

on:
  push:
    branches: [main]
  pull_request:

# SEC-08: read-only by default.
permissions: read-all

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build + postbuild (license-check sobre dist/); las páginas
      # estáticas construyen sin secretos.
      - run: npm run build

  cla:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PR author signed the CLA
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if grep -qiE "^\|\s*${AUTHOR}\s*\|" CLA-SIGNATORIES.md; then
            echo "CLA on file for ${AUTHOR}."
          else
            echo "::error::${AUTHOR} has not signed the CLA. Read CLA.md and add yourself to CLA-SIGNATORIES.md in this PR (see CONTRIBUTING.md)."
            exit 1
          fi
