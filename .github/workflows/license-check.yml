# Canon C-005 §5 (DEBE): license-check en cada build, inspeccionando el
# contenido del artefacto (npm run build ejecuta postbuild →
# scripts/license-check.mjs). Severidad error: este repo despliega a
# producción. §6: gate de CLA en cada pull request (repo con código AGPL).
name: license-check

on:
  push:
    branches: [main]
  pull_request:

# SEC-08: read-only by default.
permissions: read-all

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # build + postbuild (license-check sobre dist/); las páginas
      # estáticas construyen sin secretos.
      - run: npm run build

  cla:
    # A robot cannot sign a CLA and contributes no copyrightable work: a
    # version bump is data. Dependabot skips the gate; humans do not.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Verify PR author signed the CLA
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Literal first-column match: bot logins contain "[bot]", which a
          # regex would read as a character class and never match.
          if awk -F'|' -v a="${AUTHOR}" '{ gsub(/^ +| +$/, "", $2); if (tolower($2) == tolower(a)) f=1 } END { exit !f }' CLA-SIGNATORIES.md; then
          else
            echo "::error::${AUTHOR} has not signed the CLA. Read CLA.md and add yourself to CLA-SIGNATORIES.md in this PR (see CONTRIBUTING.md)."
            exit 1
          fi
