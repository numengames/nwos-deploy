#
# Night watch for nwos.numen.games: a probe of the live site on a schedule. On failure
# it opens a `night-watch` issue here; on recovery it closes it. The job lives
# once, in numengames/.github; this file says when and what to probe.
name: Night watch

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: night-watch
  cancel-in-progress: false

jobs:
  probe:
    uses: numengames/.github/.github/workflows/monitor.yml@c87e85e17306324752a59426f899e48059d42609
    permissions:
      issues: write
    with:
      site: nwos.numen.games
      follow-redirects: false
      checks: |
        / 200
        /how-it-works/ 200
        /updates/ 200
