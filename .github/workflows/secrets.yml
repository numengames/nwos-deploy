#
# The full-history secret scan (STD-015 SEC-004, STD-022 KEY-054): no
# secret in the tree or in any commit of its history. Red means a commit
# carries something that looks like a key; the log names the rule, the file
# and the commit, with the value redacted. Copied from numinia-archive's
# secrets.yml; only the checkout pin differs (the one ci.yml uses here).
#
# If it is a real secret: change the key at its issuer first, then remove
# it (step 2 of PRO-036) — deleting it from the tree does not take it out of
# history. If it is not a secret: add an allowance to .gitleaks.toml that
# matches only the value, with a reason; never allow a whole path.
#
# Not part of the required `build` check (ci.yml): it is seen, it does not
# gate the merge. The history was clean (with .gitleaks.toml's two test
# fixtures allowed) when this workflow was added.
#
# The scanner is the gitleaks release binary, verified against the checksum
# file its release publishes, so no third-party action and no licence key
# is involved. The token is read-only.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The whole history: a secret removed from the tree is still in
          # the commit that added it.
          fetch-depth: 0
          persist-credentials: false

      - name: install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks version

      - name: scan every commit
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
