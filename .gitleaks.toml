#
# The secret scanner's configuration (STD-015 SEC-004, STD-022 KEY-054),
# read by .github/workflows/secrets.yml. The default rule set stays on.
# Each allowance below names what it lets through and why that is not a
# secret; an allowance without a reason is how a real leak gets waved
# through.
#
# No allowance names a path: a path allowance makes the scanner skip the
# whole file, so a real key written next to a fixture would pass unseen.
# Each one matches only the value, and only for the rule that guessed
# wrong; every other rule still reads every file.

[extend]
useDefault = true

[[allowlists]]
description = "The Stripe test fixture in test/example-and-health.test.ts: a restricted key that says it is not one (rk_test_notARealKey + digits), used to prove /api/health reports a key's presence without its value"
targetRules = ["stripe-access-token"]
regexTarget = "secret"
regexes = ['''^rk_test_notARealKey\d+$''']

[[allowlists]]
description = "The WORKSPACE_KEY_SECRET fixture in test/example-and-health.test.ts: the hex digits counted twice (0123456789abcdef x2), a placeholder of the right length, never a key"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^(0123456789abcdef){2}$''']
