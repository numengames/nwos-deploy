version = 1

# Regime map per Numinia canon C-005 v1.3.0. This repo is apps/*: a
# deployable service that decides (creates client workspaces), so its code
# is AGPL-3.0-only. Code files carry their own SPDX headers; annotations
# here cover files that cannot (JSON, binaries, text assets) and set the
# per-directory regime.
#
# Ordering matters: when several annotations match a file, the LAST one in
# this file wins. Specific overrides therefore come after their directory.

# --- Application code and configuration → AGPL-3.0-only (C-005 §2) -------
[[annotations]]
path = [
  "src/**", "public/**",
  "astro.config.mjs", "tailwind.config.mjs", "tsconfig.json",
  "wrangler.jsonc", "package.json", "package-lock.json",
  ".env.example", ".gitignore",
]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "AGPL-3.0-only"

# --- Documentation, specs, guides → CC-BY-4.0 ----------------------------
[[annotations]]
path = [
  "README.md", "CLAUDE.md", "DESIGN.md",
  "nwos-iteration2-guide.md", "nwos-iteration3-guide.md",
  "TRADEMARKS.md",
]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC-BY-4.0"

# --- Brand marks → reserved (C-005 §7: the mark is the hard border) ------
[[annotations]]
path = ["public/favicon.svg", "public/favicon.ico"]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"
